; config.ini - configuration for the logging service
; All values can be changed without touching the code.

[server]
; Address to listen on. 0.0.0.0 = all interfaces (includes the ZeroTier adapter).
host = 0.0.0.0
port = 13300
; Maximum number of simultaneously connected clients.
max_clients = 50

[logging]
; Single plain-text log file (created if it does not exist).
log_file = logs/service.log
; Placeholders: {timestamp} {client_name} {ip} {port} {level} {message}
; {timestamp} is added by the server and is always UTC,
; for example 2026-10-18T22:19:00.123+00:00
format = {timestamp} {client_name} [{ip}:{port}] {level}: {message}
; Messages below this level are dropped. DEBUG < INFO < WARN < ERROR < CRITICAL
min_level = DEBUG
; Longer lines are rejected with ERR line_too_long.
max_line = 1024

[ratelimit]
; A client may send at most framelimit_messages per framelimit_seconds window.
framelimit_messages = 20
framelimit_seconds = 10
; Disconnect a client after this many rate-limit violations.
ratelimit_disconnect = 5
