;		Purpose: Configuration format for logging server. 
;			Contains the default listening interfaces
;			Sets log format as well as minimum and maximum metrics for logging to record.
;			Formats, connection interfaces, and maximums/minimums re. clients and logs 
;				are all fully adjustable without 
[server]
; By default, Server is set to listen to all incoming IPs, including ZeroTier. Port default is 13300
host = 0.0.0.0
port = 13300

; Maximum number of simultaneous server/client connections.
max_clients = 50

[logging]
; Path to single, plain text file for consolidated logs
log_file = logs/service.log
; Path and file are created if they does not exist.
;
; Placeholders: {timestamp} {client_name} {ip} {port} {level} {message}
format = {timestamp} {client_name} [{ip}:{port}] {level}: {message}
; Levels from least important to most important:
;	DEBUG < INFO < WARN < ERROR < CRITICAL
min_level = DEBUG
; Log received below minimum level are skipped
;
; Sets character limit for individual log message length
max_line = 1024
; Longer lines receive an "ERR line_too_long" response.

[ratelimit]
; A client may send at most max_messages per framelimit_seconds.
framelimit_messages = 20
framelimit_seconds = 10
;
; Disconnect a client after this many rate-limit violations.
ratelimit_disconnect = 5